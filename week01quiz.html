<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- for the first quiz there was a question that I didn't understand, So I am going to put stuff to help understand what is what here. -->
    <section class="temple highlight " > <!-- this is an opening tag. each element has an opening and closing tag. ie div or span -->
        <!-- Above inside of class is called the class attribute value. THE CLASS ITSELF IS CALLED AN ATTRIBUTE! -->
        <h3>Salt Lake Temple <!-- the stuff inside of an element that shows is called content --></h3> 
        <!-- This ^ is a nested element. the tag h3, also the p, are inside of another element, therefore are a nesting element, like a russian nesting doll. -->
        <p>The Salt Lake Temple is a landmark and symbol for The Church of Jesus Christ of Latter-day Saints.</p> <!-- Any ending segment with the / symbol is called a closing tag. -->
        <p>The purpose of this temple and all other Latter-day Saint temples is to help all of God's children come closer to Jesus Christ.</p>
    </section>
</body>
</html>
