<body>
    <header>
        <img src="images/favicon.ico" alt="Site Logo" width="16" height="16">
        <span class="name">Lego Star Wars Database</span>
        <button id="ham-btn" class="hamburger" aria-label="Navigation Menu"></button>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="database.html">Database</a></li>
            <li class="current"><a href="form.html">Submit a Set</a></li>
        </ul>
    </nav>
    </header>
    <main>
        <h1>Missing Set Submission Form</h1>
        <div class="join">
            <form method="get" action="thankyou.html" class="submit">
                <label for="sName">Set Name:<input type="text" name="sName" id="sName" required title="Enter the Set's Name"></label>
                <label for="sNumber">Set Number:<input type="number" name="sNumber" id="sNumber" required title="Enter the Set's Number"></label>
                <label for="pCount">Set Piece Count<input type="number" name="pCount" id="pCount" required title="Enter the Set's Piece Count"></label>
                <label for="year">Set Release Year:<input type="number" name="year" id="year" required title="Enter the Set's Release Year"></label>
                <label for="submit"><button type="submit">Add Missing Set Now</button></label>
            </form>
        </div>
    </main>
    <footer>
        <div class="vid-link">
